<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FrontStrike</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="crosshair"></div>
    <div id="health">
      <span class="label">HP</span>
      <span id="healthValue">100</span>
    </div>
    <div id="ammo">
      <span class="label">AMMO</span>
      <span id="ammoValue">∞</span>
    </div>
    <div id="killfeed"></div>
    <div id="hitmarker" class="hidden"></div>
    <div id="damageFlash"></div>
    <div id="scoreboard">
      <div id="scoreLine"></div>
      <div id="timer"></div>
    </div>
  </div>

  <div id="deathOverlay" class="hidden">
    <div class="death-title">ELIMINATED</div>
    <div id="deathKiller"></div>
    <div id="deathTimer">3.0s</div>
  </div>

  <div id="menu">
    <div class="menu-backdrop"></div>

    <div class="menu-content">
      <div class="menu-header">
        <h1>FRONTSTRIKE</h1>
        <p class="subtitle">multiplayer fps</p>
      </div>

      <div class="menu-main">
        <div class="menu-buttons">
          <button id="playBtn" class="menu-btn primary">PLAY</button>
          <button id="settingsBtn" class="menu-btn">SETTINGS</button>
        </div>

        <div class="menu-status">
          <div class="status-block">
            <div class="status-label">MODE</div>
            <div class="status-value" id="menuMode">dm</div>
          </div>
          <div class="status-block">
            <div class="status-label">MAP</div>
            <div class="status-value" id="menuMap">crossfire</div>
          </div>
          <div class="status-block">
            <div class="status-label">PLAYERS</div>
            <div class="status-value" id="menuCount">0</div>
          </div>
        </div>

        <div class="menu-online">
          <div class="online-header">ONLINE</div>
          <ul id="menuPlayers" class="online-list"></ul>
        </div>
      </div>

      <div class="menu-footer">
        <p class="hint">WASD move • shift sprint • space jump • click fire • esc pause</p>
      </div>
    </div>
  </div>

  <div id="namePrompt" class="hidden">
    <div class="menu-backdrop heavy"></div>
    <div class="prompt-panel">
      <h2>ENTER CALLSIGN</h2>
      <input id="nameInput" type="text" placeholder="callsign" maxlength="16" autocomplete="off" />
      <div class="prompt-buttons">
        <button id="nameConfirm" class="menu-btn primary">DEPLOY</button>
        <button id="nameCancel" class="menu-btn">CANCEL</button>
      </div>
    </div>
  </div>

  <div id="settingsPanel" class="hidden">
    <div class="menu-backdrop heavy"></div>
    <div class="prompt-panel">
      <h2>SETTINGS</h2>
      <div class="setting-row">
        <label for="sensSlider">Sensitivity</label>
        <input id="sensSlider" type="range" min="0.5" max="5" step="0.1" value="2.2" />
        <span id="sensValue">2.2</span>
      </div>
      <div class="setting-row">
        <label for="fovSlider">FOV</label>
        <input id="fovSlider" type="range" min="60" max="110" step="1" value="80" />
        <span id="fovValue">80</span>
      </div>
      <div class="prompt-buttons">
        <button id="settingsClose" class="menu-btn primary">CLOSE</button>
      </div>
    </div>
  </div>

  <div id="vote" class="hidden">
    <div class="menu-backdrop heavy"></div>
    <div class="menu-content compact">
      <div class="menu-header">
        <h2>VOTE</h2>
      </div>
      <div class="vote-section">
        <h3>MODE</h3>
        <div id="modeVote" class="vote-options"></div>
      </div>
      <div class="vote-section">
        <h3>MAP</h3>
        <div id="mapVote" class="vote-options"></div>
      </div>
    </div>
  </div>

  <div id="paused" class="hidden">
    <div class="menu-backdrop heavy"></div>
    <div class="prompt-panel">
      <h2>PAUSED</h2>
      <div class="prompt-buttons">
        <button id="resumeBtn" class="menu-btn primary">RESUME</button>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
